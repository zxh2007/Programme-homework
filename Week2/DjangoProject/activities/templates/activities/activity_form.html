{% extends 'activities/base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h1>{{ page_title }}</h1>

<form class="activity-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit">保存</button>
        <a href="{% url 'activities:activity_list' %}">取消</a>
    </div>
</form>
{% endblock %}
