<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}社团活动{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f2f4f7;
            color: #222;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .page {
            max-width: 760px;
            margin: 40px auto;
            padding: 28px 32px 40px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
        }
        h1 { margin: 0 0 18px; font-size: 26px; }
        a { color: #2f6fed; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .btn {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 6px;
            background: #2f6fed;
            color: #fff;
            font-size: 14px;
            text-decoration: none;
        }
        .search { display: flex; gap: 8px; margin: 18px 0 10px; }
        .search input[type="text"] { flex: 1; }
        .hint { margin: 4px 0 0; color: #6b7280; font-size: 13px; }
        .activities { margin: 12px 0 0; padding: 0; list-style: none; }
        .activities li { padding: 16px 0; border-top: 1px solid #eef1f5; }
        .activities h2 { margin: 0 0 6px; font-size: 19px; }
        .activities h2 a { color: #1a1a1a; text-decoration: none; }
        .activities h2 a:hover { color: #2f6fed; }
        .meta { margin: 4px 0; color: #6b7280; font-size: 13px; }
        .desc { margin: 8px 0; line-height: 1.65; white-space: pre-line; }
        .actions { margin: 8px 0 0; font-size: 13px; }
        .actions a { margin-right: 14px; text-decoration: none; }
        .actions a.delete { color: #d9534f; }
        .empty { color: #6b7280; }
        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccd2da;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        button {
            padding: 9px 18px;
            border: 0;
            border-radius: 6px;
            background: #2f6fed;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button.danger { background: #d9534f; }
        .activity-form p { margin: 14px 0; }
        .activity-form label { display: block; margin-bottom: 6px; font-weight: 600; }
        .activity-form textarea { height: 96px; resize: vertical; }
        .form-actions { margin-top: 22px; }
        .form-actions a { margin-left: 16px; text-decoration: none; }
        .errorlist { margin: 6px 0 0; padding-left: 18px; color: #c0392b; font-size: 13px; }
    </style>
</head>
<body>
<div class="page">
    {% block content %}{% endblock %}
</div>
</body>
</html>
